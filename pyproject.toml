[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zmcp"
version = "0.1.0"
description = "Deterministic conversation-startup grounding MCP server for AI chat clients."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
]

[project.optional-dependencies]
drive = ["google-auth>=2.0", "google-auth-oauthlib>=1.0"]
dev = [
    "pytest>=7",
]

[project.scripts]
zmcp = "zmcp.server:main"
zmcp-auth = "zmcp.auth:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zmcp = ["fixtures/default/**/*.json"]
